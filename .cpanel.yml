---
deployment:
  tasks:
    - export DEPLOYPATH="$HOME/public_html/rockpaperscissors"
    - test -L "$DEPLOYPATH" && test -d "$DEPLOYPATH" && /bin/cp index.html main.js build.js default.config.json "$DEPLOYPATH/" && /bin/cp -R assets ui sim lab "$DEPLOYPATH/"
    - test -L "$DEPLOYPATH" && test -d "$DEPLOYPATH" && /bin/cp -R dev "$DEPLOYPATH/"
